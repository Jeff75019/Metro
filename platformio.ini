; Afficheur Métro — Waveshare ESP32-S3-Touch-LCD-1.9
; Compilation : pio run        Téléversement : pio run -t upload
; Moniteur série : pio device monitor
;
; Cœur Arduino ESP32 3.3.12 via la plateforme communautaire "pioarduino"
; (la plateforme espressif32 officielle de PlatformIO reste en cœur 2.x).

[platformio]
src_dir = Metro
default_envs = waveshare-s3-lcd19

[env:waveshare-s3-lcd19]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8 : 16 Mo de flash QIO, 8 Mo de PSRAM octale
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = app3M_fat9M_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.36
    bblanchon/ArduinoJson@^7.4.0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
