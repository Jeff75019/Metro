:root{
  --bg:#05070c;--bg2:#080b12;--panel:#0c111a;--panel2:#111826;--panel3:#162033;
  --edge:#1a2332;--edge2:#26324a;
  --txt:#f3f5f9;--mut:#8d97ab;--dim:#566074;
  --amber:#ffb400;--amber-soft:#ffcf5a;--amber-dim:#a77a12;
  --green:#22d27b;--orange:#ff8c1a;--red:#ff4f4f;--blue:#4aa3ff;
  --time:#ffb400;--time-soft:#ffcf5a;--time-dim:#a77a12;--link:#ffb400;
  --glow:#0d1524;--top1:#0a0f19;--top2:#070a11;--field:#0a0f18;--field-focus:#141c2b;--chip:#1d2738;--chip-txt:#cfd6e4;
  --inv:#0b0f17;--txt2:#d5dbe6;--scroll:#1e2738;--loader:#151d2b;--toast:#1a2232;--sw:#243047;--sw-knob:#cfd6e4;--meter:#1a2332;
  --results:rgba(13,18,28,.97);--hair:rgba(255,255,255,.04);--shadow:rgba(0,0,0,.35);--shadow-lg:rgba(0,0,0,.6);
  --cond:"Barlow Condensed","Bahnschrift","Arial Narrow",sans-serif;
  --sans:"Barlow","Segoe UI",system-ui,sans-serif;
  --r:16px;--side:340px;
  color-scheme:dark;
}
/* Thème clair : quai en plein jour (mêmes couleurs de lignes, chiffres foncés) */
:root[data-theme=light]{
  color-scheme:light;
  --bg:#e8ecf2;--bg2:#f3f5f9;--panel:#ffffff;--panel2:#ffffff;--panel3:#edf1f7;
  --edge:#d8dee8;--edge2:#c3ccda;
  --txt:#0b1220;--mut:#556074;--dim:#8a93a6;
  --amber-soft:#ffcf5a;--amber-dim:#c08a2a;
  --green:#0d9450;--orange:#d16000;--red:#d42c2c;--blue:#1f6fd1;
  --time:#ad5a00;--time-soft:#c27412;--time-dim:#b48a52;--link:#a55600;
  --glow:#ffffff;--top1:#ffffff;--top2:#f6f8fb;--field:#f2f4f8;--field-focus:#ffffff;--chip:#e6eaf1;--chip-txt:#2b3446;
  --inv:#ffffff;--txt2:#2b3446;--scroll:#c3ccda;--loader:#e1e6ee;--toast:#ffffff;--sw:#c9d1de;--sw-knob:#ffffff;--meter:#e1e6ee;
  --results:rgba(255,255,255,.98);--hair:rgba(10,20,40,.08);--shadow:rgba(20,30,50,.09);--shadow-lg:rgba(20,30,50,.2);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--txt);font:15px/1.35 var(--sans);overflow:hidden;
  background:radial-gradient(1200px 600px at 20% -10%,var(--glow) 0,transparent 60%),var(--bg);
  display:grid;grid-template-rows:auto 1fr auto;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{width:20px;height:20px;flex:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ---- En-tête ---------------------------------------------------------------- */
/* Trois colonnes : la recherche au centre de la fenêtre, KeoLive collé à sa gauche, horloge et boutons
   à droite. Les deux côtés ont la même largeur (celle du groupe de droite) pour que le centre soit exact. */
.top{display:grid;grid-template-columns:minmax(410px,1fr) minmax(0,640px) minmax(410px,1fr);align-items:center;column-gap:16px;
  padding:12px 22px;border-bottom:1px solid var(--edge);
  background:linear-gradient(var(--top1),var(--top2));position:relative;z-index:20}
.brand{display:flex;align-items:center;justify-content:flex-start;gap:12px;flex:none;padding:0;border-radius:12px;justify-self:end}
.brand-name{font:700 27px/1.1 var(--cond);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
/* Le « K » du nom reprend celui du logo Keolis (hauteur des capitales, posé sur la ligne de base) */
.kmark{height:1.12em;width:1.413em;vertical-align:baseline;margin-right:.2em;color:#41a8be;overflow:visible}
.ktext{font-size:.66em;font-weight:600;letter-spacing:.2em}   /* le reste du nom, plus petit, sur la même ligne de base */
.search{flex:1;min-width:0;position:relative;display:flex;align-items:center;gap:10px;
  height:46px;padding:0 14px;border-radius:23px;background:var(--panel2);border:1px solid var(--edge2);transition:border-color .15s,background .15s}
.search:focus-within{border-color:var(--amber);background:var(--field-focus)}
.search .ico{color:var(--mut)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font:500 17px var(--sans)}
.search input::placeholder{color:var(--dim)}
.search input::-webkit-search-cancel-button{display:none}
kbd{font:600 11px var(--sans);color:var(--mut);border:1px solid var(--edge2);border-bottom-width:2px;border-radius:6px;padding:2px 6px;flex:none}
.clock{font:600 40px/1 var(--cond);letter-spacing:.02em;font-variant-numeric:tabular-nums;flex:none;min-width:98px;text-align:right}
.top-end{display:flex;align-items:center;gap:22px;justify-self:end}
.clock .sep{color:var(--time);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.tools{display:flex;gap:6px;flex:none}
.tool{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--mut);border:1px solid transparent;transition:.15s}
.tool:hover{background:var(--panel2);color:var(--txt);border-color:var(--edge2)}
.tool[aria-pressed=true]{color:#111;background:var(--amber)}
/* Fenêtre plus étroite (par exemple un écran à 125 ou 150 %) : la recherche reste au centre, KeoLive à sa
   gauche ; ce sont l'horloge et les boutons qui rapetissent pour laisser de la place à la recherche. */
@media (max-width:1500px){
  .top{grid-template-columns:minmax(340px,1fr) minmax(0,640px) minmax(340px,1fr)}
  .top-end{gap:14px}
  .clock{font-size:34px;min-width:84px}
  .tools{gap:4px}
  .tool{width:36px;height:36px}
}
@media (max-width:1040px){
  .top{grid-template-columns:minmax(290px,1fr) minmax(0,640px) minmax(290px,1fr);column-gap:12px;padding:10px 16px}
  .top-end{gap:10px}
  .clock{font-size:30px;min-width:74px}
  .tools{gap:2px}
  .tool{width:32px;height:32px}
  .search kbd{display:none}
}

/* ---- Résultats de recherche ---------------------------------------------------- */
.results{position:absolute;left:0;right:0;top:54px;max-height:min(70vh,560px);overflow:auto;padding:8px;
  background:var(--results);backdrop-filter:blur(14px);border:1px solid var(--edge2);border-radius:18px;
  box-shadow:0 24px 60px var(--shadow-lg)}
.rgroup{font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:10px 12px 6px}
.ritem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer}
.ritem[aria-selected=true],.ritem:hover{background:var(--panel3)}
.ritem .rname{font:600 21px/1.1 var(--cond);flex:1 0 auto;max-width:70%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .rsub{font:500 13px var(--sans);color:var(--mut);flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.ritem .rlines{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:50%}
.rnote{padding:14px;color:var(--mut);font-size:14px}

/* ---- Pictogrammes de lignes ----------------------------------------------------- */
.lb{--s:30px;display:inline-grid;place-items:center;min-width:var(--s);height:var(--s);padding:0 .28em;
  font:700 calc(var(--s)*.62)/1 var(--cond);letter-spacing:-.01em;flex:none;border-radius:50%}
.lb.rer,.lb.train{border-radius:22%}
.lb.tram{border-radius:5px;box-shadow:inset 0 3px 0 rgba(0,0,0,.28),inset 0 -3px 0 rgba(0,0,0,.28)}
.lb.bus,.lb.navette,.lb.autre{border-radius:6px;padding:0 .4em}
.lb.sm{--s:22px}.lb.lg{--s:40px}.lb.xl{--s:54px}
.mode{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.mode svg{width:18px;height:18px}

/* ---- Mise en page ------------------------------------------------------------------ */
.layout{display:grid;grid-template-columns:1fr var(--side);min-height:0}
.board{overflow:auto;padding:22px;min-height:0;container:board/inline-size}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(400px,100%),1fr));grid-auto-flow:row dense;align-items:start}
.grid .card.wide{grid-column:span 2}
@media (max-width:1180px){.grid .card.wide{grid-column:auto}}
@media (max-width:960px){.layout{grid-template-columns:1fr}.traffic{display:none}}

/* ---- Cartes (quai) ------------------------------------------------------------------ */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);border-radius:var(--r);
  overflow:hidden;position:relative;box-shadow:0 10px 30px var(--shadow);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.card.drag{opacity:.4}.card.over{outline:2px dashed var(--amber);outline-offset:3px}
.card-bar{height:5px;display:flex}.card-bar i{flex:1}
.card-head{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--edge);cursor:grab}
.card-head .lbs{display:flex;gap:5px;flex-wrap:wrap}
.card-title{flex:1;min-width:0}
.card-name{font:700 27px/1.05 var(--cond);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font:500 13px var(--sans);color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.card:hover .card-acts,.card:focus-within .card-acts{opacity:1}
.ibtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mut)}
.ibtn:hover{background:var(--panel3);color:var(--txt)}
.ibtn svg{width:18px;height:18px}
.card-alert{display:flex;align-items:center;gap:10px;padding:8px 16px;font:600 14px var(--sans);cursor:pointer;
  background:rgba(255,140,26,.12);color:var(--orange);border-bottom:1px solid rgba(255,140,26,.25)}
.card-alert.l3{background:rgba(255,79,79,.13);color:var(--red);border-color:rgba(255,79,79,.3)}
.card-alert svg{width:18px;height:18px}
.card-alert span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body{padding:4px 0}
.card-foot{display:flex;align-items:center;gap:8px;padding:8px 16px 10px;font:500 12px var(--sans);color:var(--dim);border-top:1px solid var(--edge)}
.card-foot .grow{flex:1}
.card-foot .err{color:var(--orange)}

/* Lignes de passages : direction et minutes */
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 16px;min-height:62px}
.row+.row{border-top:1px solid var(--hair)}
.dest{min-width:0}
.dest-name{font:600 25px/1.05 var(--cond);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest-name svg{width:16px;height:16px;color:var(--dim);vertical-align:-1px;margin-right:4px}
.dest-info{display:flex;gap:8px;align-items:center;margin-top:4px;font:500 13px var(--sans);color:var(--mut);white-space:nowrap;overflow:hidden}
.chip{display:inline-block;font:700 13px/1 var(--cond);letter-spacing:.08em;padding:3px 6px 2px;border-radius:5px;background:var(--chip);color:var(--chip-txt);text-transform:uppercase}
.chip.voie{background:var(--txt);color:var(--inv)}
.times{display:flex;align-items:baseline;gap:16px;font-variant-numeric:tabular-nums}
.t{font:700 46px/1 var(--cond);color:var(--time);text-align:right;min-width:52px;white-space:nowrap}
.t small{font:600 16px var(--cond);color:var(--time-dim);margin-left:2px;letter-spacing:.04em}
.t.next{font-size:30px;color:var(--time-soft);opacity:.75;min-width:40px}
.t.next small{font-size:13px}
.t.now{font-size:26px;letter-spacing:.06em;animation:pulse 1.2s ease-in-out infinite}
.t.clock{font-size:34px}
.t.cancel{color:var(--red);font-size:22px;letter-spacing:.06em}
.t.late{color:var(--orange)}
@keyframes pulse{50%{opacity:.35}}
.more{padding:8px 16px 12px;font:500 13px var(--sans);color:var(--dim)}
.state{padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--mut)}
.state b{font:600 21px var(--cond);color:var(--txt);letter-spacing:.02em}
.state.err b{color:var(--orange)}
.loader{width:120px;height:4px;border-radius:4px;background:linear-gradient(90deg,transparent,var(--amber),transparent) -120px 0/120px 100% no-repeat,var(--loader);animation:load 1.1s linear infinite}
@keyframes load{to{background-position:120px 0,0 0}}

/* Tableau SNCF */
.seg{display:inline-flex;background:var(--field);border:1px solid var(--edge2);border-radius:10px;padding:3px}
.seg button{font:700 13px var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:7px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--amber);color:#111}
.gtabs{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--edge);overflow-x:auto;scrollbar-width:none}
.gtabs::-webkit-scrollbar{display:none}
.gtab{flex:none;font:700 16px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:8px 13px 7px;border-radius:999px;
  background:var(--field);border:1px solid var(--edge2);color:var(--mut);white-space:nowrap;transition:.15s}
.gtab:hover{color:var(--txt);border-color:var(--mut)}
.gtab[aria-pressed=true]{background:var(--amber);color:#111;border-color:var(--amber)}
body.compact .gtabs{padding:8px 12px;gap:4px}
body.compact .gtab{font-size:14px;padding:6px 9px 5px}
.trow{display:grid;grid-template-columns:70px 1fr auto 74px 110px;gap:14px;align-items:center;padding:9px 16px;min-height:54px}
.trow+.trow{border-top:1px solid var(--hair)}
.trow.head{min-height:0;padding:10px 16px 4px;font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.th{font:700 28px/1 var(--cond);color:var(--time);font-variant-numeric:tabular-nums}
.th s{color:var(--dim);font-size:20px;display:block;text-decoration-thickness:2px}
.tdest{font:600 23px/1.05 var(--cond);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttrain{display:flex;flex-direction:column;align-items:flex-start;gap:3px;font:600 13px var(--sans);color:var(--mut)}
.tvoie{min-width:44px;height:40px;padding:0 7px;border-radius:8px;display:grid;place-items:center;font:700 22px/1 var(--cond);background:var(--txt);color:var(--inv);white-space:nowrap;justify-self:start}
.tvoie.none{background:transparent;border:1px dashed var(--edge2);color:var(--dim);font-size:16px}
.tstate{font:700 16px/1.1 var(--cond);letter-spacing:.05em;text-transform:uppercase;text-align:right}
.tstate.ok{color:var(--green)}.tstate.late{color:var(--orange)}.tstate.cancel{color:var(--red)}.tstate.plan{color:var(--dim)}

/* ---- Bandeau, premier lancement, tableau vide ---------------------------------------- */
.banner{display:flex;align-items:center;gap:18px;padding:18px 20px;margin-bottom:18px;border-radius:var(--r);
  background:linear-gradient(90deg,rgba(255,180,0,.14),rgba(255,180,0,.04));border:1px solid rgba(255,180,0,.35)}
.banner .bi{width:44px;height:44px;border-radius:12px;background:var(--amber);color:#111;display:grid;place-items:center;flex:none}
.banner .bt{flex:1;min-width:0}
.banner b{display:block;font:700 21px var(--cond);letter-spacing:.03em}
.banner p{margin:3px 0 0;color:var(--txt2);font-size:14px}
.banner a{color:var(--link)}
.field{display:flex;gap:8px;align-items:center}
.inp{height:42px;border-radius:11px;border:1px solid var(--edge2);background:var(--field);padding:0 12px;min-width:260px;outline:0}
.inp:focus{border-color:var(--amber)}
.btn{height:42px;padding:0 18px;border-radius:11px;font:700 15px var(--sans);background:var(--panel3);border:1px solid var(--edge2);
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--amber);color:#111;border-color:var(--amber)}
.btn.pri:hover{background:var(--amber-soft)}
.btn:disabled{opacity:.5;cursor:default}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:70px 20px;color:var(--mut)}
.empty .big{font:700 46px/1 var(--cond);color:var(--txt);letter-spacing:.03em;text-transform:uppercase}
.empty .big em{font-style:normal;color:var(--time)}
.empty p{margin:0;max-width:520px;font-size:16px}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.sug{display:inline-flex;align-items:center;gap:8px;padding:9px 14px 9px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--edge2);font:600 18px var(--cond);color:var(--txt);text-transform:uppercase;letter-spacing:.03em}
.sug:hover{border-color:var(--amber)}

/* ---- Trafic ---------------------------------------------------------------------- */
.traffic{border-left:1px solid var(--edge);background:var(--bg2);overflow:auto;padding:20px 18px 26px;min-height:0}
.tr-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.tr-head h2{margin:0;font:700 24px var(--cond);letter-spacing:.14em;text-transform:uppercase}
.tr-head span{font-size:12px;color:var(--dim)}
.tr-sum{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--edge);font:600 15px var(--sans);margin-bottom:16px}
.tr-sum svg{width:22px;height:22px}
.tr-sum.ok{color:var(--green)}.tr-sum.bad{color:var(--orange)}.tr-sum.na{color:var(--mut)}
.tr-group{margin-bottom:16px}
.tr-label{font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.tr-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:8px}
.tb{position:relative;display:grid;place-items:center;padding:3px;border-radius:12px;border:1px solid transparent}
.tb:hover{background:var(--panel2);border-color:var(--edge2)}
.tb .dot{position:absolute;right:1px;top:1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg2)}
.tb.s0 .dot{display:none}
.tb.s1 .dot{background:var(--blue)}.tb.s2 .dot{background:var(--orange)}.tb.s3 .dot{background:var(--red)}
.tb.w .dot{background:var(--blue)}
.tb.s2 .lb,.tb.s3 .lb{box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--orange)}
.tb.s3 .lb{box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--red)}
.tr-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.ti{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;padding:10px 12px;border-radius:12px;
  background:var(--panel);border:1px solid var(--edge);border-left:4px solid var(--orange)}
.ti:hover{border-color:var(--edge2);border-left-color:inherit}
.ti.l3{border-left-color:var(--red)}.ti.l1{border-left-color:var(--blue)}
.ti b{display:block;font:600 17px/1.15 var(--cond);letter-spacing:.02em}
.ti .sub{display:block;font-size:12.5px;color:var(--mut);margin-top:3px}
.ti .tag{display:inline-block;font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin:0 0 3px}
.ti.l3 .tag{color:var(--red)}.ti.l1 .tag{color:var(--blue)}
.tr-note{font-size:13px;color:var(--mut);line-height:1.45}

/* ---- Bandeau défilant ---------------------------------------------------------------- */
.ticker{display:flex;align-items:stretch;height:42px;border-top:1px solid var(--edge);background:#04060a;overflow:hidden;--txt:#f3f5f9}
.ticker-label{display:flex;align-items:center;padding:0 16px;background:var(--amber);color:#111;font:700 15px var(--cond);letter-spacing:.16em;text-transform:uppercase;flex:none}
.ticker-track{flex:1;overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.ticker-run{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:44px;white-space:nowrap;padding-left:100%;
  font:600 19px var(--cond);letter-spacing:.03em;color:#ffcf5a;animation:run linear infinite}
.ticker:hover .ticker-run{animation-play-state:paused}
.ticker-run .tk{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.ticker-run .tk b{color:var(--txt);text-transform:uppercase}
@keyframes run{to{transform:translateX(-100%)}}

/* ---- État (bas d'écran) ---------------------------------------------------------------- */
.status{position:fixed;left:50%;bottom:58px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:10px 16px;border-radius:12px;background:var(--toast);border:1px solid var(--edge2);font:600 14px var(--sans);
  transition:.25s;box-shadow:0 12px 30px var(--shadow-lg);z-index:50}
.status.show{opacity:1;transform:translate(-50%,0)}

/* ---- Fenêtres (aperçu, détail trafic, réglages) -------------------------------------------- */
.dlg{padding:0;border:1px solid var(--edge2);border-radius:20px;background:var(--panel);color:var(--txt);
  width:min(760px,calc(100vw - 40px));max-height:calc(100vh - 60px);box-shadow:0 30px 90px var(--shadow-lg)}
.dlg::backdrop{background:rgba(2,4,8,.5);backdrop-filter:blur(4px)}
.dlg[open]{animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.dlg-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--edge)}
.dlg-head h3{flex:1;margin:0;font:700 26px/1.1 var(--cond);letter-spacing:.04em;text-transform:uppercase}
.dlg-body{padding:18px 20px;overflow:auto;max-height:calc(100vh - 220px)}
.dlg-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--edge)}
.dlg .card{box-shadow:none;animation:none}
.dlg .card .card-acts{display:none}
.msg{padding:14px 16px;border-radius:14px;background:var(--panel2);border:1px solid var(--edge);border-left:4px solid var(--orange);margin-bottom:12px}
.msg.l3{border-left-color:var(--red)}.msg.l1{border-left-color:var(--blue)}
.msg h4{margin:0 0 6px;font:700 20px/1.15 var(--cond);letter-spacing:.02em}
.msg .when{font:600 12.5px var(--sans);color:var(--mut);margin-bottom:8px}
.msg p{margin:0;white-space:pre-line;color:var(--txt2);font-size:14.5px;line-height:1.5;user-select:text}
.set{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--edge)}
.set:last-child{border-bottom:0}
.set b{font:600 16px var(--sans)}
.set span{grid-column:1;font-size:13px;color:var(--mut);line-height:1.45}
.set span a{color:var(--link)}
.set .ctl{grid-row:1/span 2;grid-column:2}
.set .inp{min-width:300px}
.sw{position:relative;width:46px;height:26px;border-radius:13px;background:var(--sw);transition:.15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--sw-knob);transition:.15s}
.sw[aria-checked=true]{background:var(--amber)}.sw[aria-checked=true]::after{left:23px;background:#111}
.meter{height:6px;border-radius:6px;background:var(--meter);overflow:hidden;margin-top:8px;width:300px}
.meter i{display:block;height:100%;background:var(--amber)}
.about{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:14px}

/* ---- Alertes d'incident (fenêtres pop-up, en haut à droite) --------------------------------- */
.alerts{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 40px));max-height:calc(100vh - 110px);
  display:flex;flex-direction:column;gap:14px;z-index:40;pointer-events:none;border-radius:20px;transition:box-shadow .3s}
.alerts:has(.alert){box-shadow:0 0 0 200vmax rgba(2,4,8,.42)}   /* voile sur le tableau (les clics passent) */
:root[data-theme=light] .alerts:has(.alert){box-shadow:0 0 0 200vmax rgba(20,30,50,.22)}
.alert{pointer-events:auto;background:var(--panel);border:1px solid var(--edge2);border-left:8px solid var(--orange);border-radius:20px;
  box-shadow:0 30px 90px var(--shadow-lg);padding:18px 22px 16px;animation:alert-in .38s cubic-bezier(.2,.9,.3,1.15) both;overflow:hidden;position:relative;flex:none}
.alert.l3{border-left-color:var(--red)}.alert.end{border-left-color:var(--green)}
.alert.out{animation:alert-out .25s ease both}
@keyframes alert-in{from{opacity:0;transform:scale(.9)}}
@keyframes alert-out{to{opacity:0;transform:scale(.95)}}
.alert-head{display:flex;align-items:center;gap:10px}
.alert-head .lbs{display:flex;gap:5px;flex-wrap:wrap}
.alert-tag{flex:1;font:700 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.alert.l3 .alert-tag{color:var(--red)}.alert.end .alert-tag{color:var(--green)}
.alert h4{margin:12px 0 5px;font:700 30px/1.1 var(--cond);letter-spacing:.02em}
.alert .when{font:600 12.5px var(--sans);color:var(--mut)}
.alert-msg{margin:10px 0 0;font-size:15.5px;line-height:1.5;color:var(--txt2);white-space:pre-line;max-height:11em;overflow:auto;user-select:text}
.alert-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.alert-foot .btn{height:38px;padding:0 16px;font-size:14px}
.alert-life{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--edge2);transform-origin:left;animation:life linear both}
.alert:hover .alert-life{animation-play-state:paused}
@keyframes life{to{transform:scaleX(0)}}
body.compact .alerts{width:calc(100vw - 16px)}
body.compact .alert h4{font-size:22px}

/* ---- À propos ---------------------------------------------------------------------------- */
.about-top{padding:10px 0 20px}
.about-name{font:700 52px/1.1 var(--cond);letter-spacing:.06em;text-transform:uppercase}
.about-ver{margin-top:6px;font:600 15px var(--sans);color:var(--mut)}
.about-rows{display:grid;grid-template-columns:auto 1fr;gap:14px 22px;align-items:center;padding:18px 0;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.about-rows dt{font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.about-rows dd{margin:0;font:600 22px/1.1 var(--cond);letter-spacing:.02em}
.about-rows .plate{display:inline-flex;padding:12px 18px;border-radius:12px;background:#fff;border:1px solid var(--edge2)}
.about-rows .plate img{height:30px;width:auto;display:block}
/* Lignes en construction (colonne Trafic) */
.tb.future .lb{opacity:.45;filter:saturate(.6)}
.tb.future::after{content:"";position:absolute;inset:1px;border-radius:12px;border:1px dashed var(--edge2);pointer-events:none}
.stops-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stops-list span{font:600 15px var(--cond);letter-spacing:.02em;padding:4px 9px;border-radius:999px;background:var(--panel3);border:1px solid var(--edge)}

/* ---- Fenêtre étroite ------------------------------------------------------------------------ */
/* En-tête sur deux lignes : KeoLive à gauche, horloge et boutons à droite, la recherche dessous */
@media (max-width:959px){
  .top{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"brand end" "search search";
    row-gap:10px;column-gap:12px;padding:10px 16px 12px}
  .brand{grid-area:brand;justify-self:start}
  .top-end{grid-area:end}
  .search{grid-area:search;height:42px}
  .board{padding:16px}
}
@media (max-width:479px){
  .ktext{display:none}                 /* le « K » seul, comme l'icône */
  .top{padding:8px 12px 10px}
  .top-end{gap:8px}
  .clock{font-size:28px;min-width:0}
  .tools{gap:0}
  .tool{width:32px;height:32px}
  .board{padding:10px}
  .empty .big{font-size:32px}
}
/* Réglages et À propos : chaque réglage sur une colonne, le contrôle sous son explication */
@media (max-width:600px){
  .set{grid-template-columns:minmax(0,1fr)}
  .set>:nth-child(3){grid-row:auto;grid-column:1;justify-self:start;margin-top:6px}
  .set .ctl:has(.inp){justify-self:stretch}   /* le champ de la clé, sur toute la largeur */
  .set .inp{min-width:0;width:100%}
  .set .inp.ctl{width:140px}
  .about-rows{grid-template-columns:minmax(0,1fr);gap:6px}
  .about-rows dd{margin-bottom:10px}
  .about-rows .plate img{height:24px}
}
/* Bandeau de la clé : texte, puis le champ sur toute la largeur */
@container board (max-width:800px){
  .banner{flex-wrap:wrap;gap:12px 14px;padding:16px}
  .banner .bt{flex:1 1 220px}
  .banner .field{flex:1 1 100%}
  .banner .inp{flex:1;min-width:0}
}
/* Cartes étroites : les boutons Départs / Arrivées passent sous le nom, colonnes des trains resserrées */
.card{container-type:inline-size}
@container (max-width:480px){
  .card-head{flex-wrap:wrap;row-gap:8px;position:relative}
  .card-acts{position:absolute;top:8px;right:10px;background:var(--panel2);border-radius:10px;box-shadow:0 4px 14px var(--shadow-lg)}
  .card-title{flex:1 1 170px}
  .trow{grid-template-columns:56px minmax(0,1fr) 68px 70px;gap:10px;padding-left:12px;padding-right:12px}
  .th{font-size:24px}.th s{font-size:17px}
  .tdest{font-size:20px}
  .tvoie{font-size:19px;height:34px;min-width:38px;padding:0 6px}

/* ---- Mode compact (petite fenêtre, une carte) ---------------------------------------------- */
/* Plein écran : curseur masqué après quelques secondes sans bouger la souris */
body.fs.idle,body.fs.idle *{cursor:none!important}
body.compact{--r:0px}
body.compact .top{display:flex;padding:8px 12px;gap:10px}
body.compact .top-end{gap:10px}
body.compact .tools{gap:6px}
body.compact .ktext,body.compact .search,body.compact .traffic,body.compact .ticker,body.compact .banner{display:none}
body.compact .brand{flex:1}
body.compact .clock{font-size:30px;min-width:0}
body.compact .tool{width:34px;height:34px}
body.compact .layout{grid-template-columns:1fr}
body.compact .board{padding:0}
body.compact .grid{display:block}
body.compact .grid .card{border:0;box-shadow:none;animation:none}
body.compact .grid .card:not(.cshow){display:none}
body.compact .card-head{padding:10px 14px 8px}
body.compact .card-name{font-size:23px}
body.compact .lb.lg{--s:34px}
body.compact .row{min-height:52px;padding:7px 14px;gap:10px}
body.compact .dest-name{font-size:22px}
body.compact .t:not(.now):not(.cancel):not(.clock){font-size:38px}
body.compact .t.next:not(.now):not(.cancel){font-size:26px}
body.compact .card-alert{padding:6px 14px;font-size:13px}
body.compact .card-foot{display:none}
.pager{display:flex;align-items:center;gap:2px;font:600 14px var(--cond);color:var(--mut);letter-spacing:.06em}
.pager .ibtn{font:700 22px/1 var(--sans)}
body.compact .card-acts{display:none}
body.compact .empty{padding:24px}
body.compact .empty .big{font-size:30px}

</style>

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(3)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}

function icon(id, cls) {
  const s = document.createElementNS(SVGNS, 'svg');
  if (cls) s.setAttribute('class', cls);
  const u = document.createElementNS(SVGNS, 'use');
  u.setAttribute('href', '#' + id);
  s.append(u);
  return s;
}

const store = {

const now = () => Date.now() + timeShift;

// ---- Heure de Paris (quel que soit le fuseau de l'ordinateur) -------------------------
const TZ = 'Europe/Paris';
const fmtHM = new Intl.DateTimeFormat('fr-FR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const fmtDay = new Intl.DateTimeFormat('fr-FR', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' });
const fmtParts = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit',
  day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
const hm = ms => fmtHM.format(new Date(ms));

function parisParts(ms) {
  const o = {};
  for (const p of fmtParts.formatToParts(new Date(ms))) o[p.type] = p.value;
  return { y: +o.year, mo: +o.month, d: +o.day, h: +o.hour % 24, m: +o.minute, s: +o.second };
}
function parisToMs(y, mo, d, secs) {      // heure « murale » de Paris -> instant
  const wall = Date.UTC(y, mo - 1, d) + secs * 1000;
  let t = wall;
  for (let i = 0; i < 2; i++) {
    const p = parisParts(t);
    t -= Date.UTC(p.y, p.mo - 1, p.d, p.h, p.m, p.s) - wall;
  }
  return t;
}
const parseCompact = s => s && s.length >= 15  // « 20261120T110000 » (heure de Paris)
  ? parisToMs(+s.slice(0, 4), +s.slice(4, 6), +s.slice(6, 8), +s.slice(9, 11) * 3600 + +s.slice(11, 13) * 60 + +s.slice(13, 15))
  : NaN;

  const same = dayKey(begin) === dayKey(end);
  const day = ms => dayKey(ms) === dayKey(now()) ? '' : fmtDay.format(new Date(ms)) + ' ';

  if (!ids.length) return;
  const where = ids.map(i => `id_line="${i}"`).join(' or ');
  const url = ODS_IDFM + 'referentiel-des-lignes/records?limit=30&select=id_line,shortname_line,transportmode,' +
    'colourweb_hexa,textcolourweb_hexa&where=' + encodeURIComponent(where);
  try {
    const j = await (await fetch(url)).json();
    const modes = { metro: 'metro', rail: 'rer', tram: 'tram', bus: 'bus', funicular: 'navette', cableway: 'navette' };
    for (const r of j.results || []) {
      lineCache[r.id_line] = { n: r.shortname_line || '?', m: modes[r.transportmode] || 'bus',
        c: '#' + (r.colourweb_hexa || '36405a'), t: '#' + (r.textcolourweb_hexa || 'ffffff') };
      missingLines.delete(r.id_line);
    }
    store.set('lines', lineCache);
    renderAll();
  } catch { /* hors ligne : pictogrammes neutres */ }
  if (pendingLines.size) loadLinesSoon();
}

// =============================================================================
//  API PRIM (Île-de-France Mobilités)
// =============================================================================
const PRIM = 'https://prim.iledefrance-mobilites.fr/marketplace';

class ApiError extends Error {
  constructor(kind, msg) { super(msg); this.kind = kind; }
}

// PRIM refuse les appels (429 : quota de la clé atteint, ou trop d'appels à la seconde) : plus
// aucun appel pendant une pause de plus en plus longue (15 s, 1 min, 4 min, puis 15 min)
const primPause = { until: 0, ms: 0 };
const PRIM_429 = 'PRIM refuse les appels (quota de la clé atteint ?) : réglez le quota de votre abonnement dans ⚙ Réglages';
async function primGet(path, kind = 'prim') {
  if (!settings.apiKey) throw new ApiError('nokey', 'Clé PRIM manquante');
  if (Date.now() < primPause.until) throw new ApiError('quota', PRIM_429);
  if (kind === 'prim' && quota.used('prim') >= settings.budget) throw new ApiError('quota', 'Quota du jour atteint');
  let r;
  try {
    r = await fetch(PRIM + path, { headers: { apikey: settings.apiKey, Accept: 'application/json' } });
  } catch {
    throw new ApiError('net', 'PRIM injoignable (réseau ou pare-feu)');
  }
  quota.add(kind);
  if (r.status === 401 || r.status === 403) throw new ApiError('key', `Clé PRIM refusée (${r.status})`);
  if (r.status === 429) {
    primPause.ms = Math.min(15 * 60e3, primPause.ms ? primPause.ms * 4 : 15e3);
    primPause.until = Date.now() + primPause.ms;
    throw new ApiError('quota', PRIM_429);
  }
  primPause.ms = 0;
  if (r.status === 400) throw new ApiError('http', 'Arrêt inconnu de PRIM');
  if (!r.ok) throw new ApiError('http', `PRIM indisponible (${r.status})`);
  try { return await r.json(); } catch { throw new ApiError('http', 'Réponse PRIM illisible'); }
}

const val = a => Array.isArray(a) ? (a[0] && a[0].value) || '' : (a && a.value) || '';

function parseVisits(json) {
  const del = (((json || {}).Siri || {}).ServiceDelivery || {}).StopMonitoringDelivery || [];
  const out = [];
  for (const d of del) for (const v of d.MonitoredStopVisit || []) {
    const j = v.MonitoredVehicleJourney || {}, c = j.MonitoredCall || {};
    const line = lineIdOf(val(j.LineRef) || (j.LineRef && j.LineRef.value));
    const t = Date.parse(c.ExpectedDepartureTime || c.ExpectedArrivalTime || c.AimedDepartureTime || c.AimedArrivalTime || '');
    if (!line || isNaN(t)) continue;
    const st = String(c.DepartureStatus || c.ArrivalStatus || '').toLowerCase();
    let plat = val(c.DeparturePlatformName) || val(c.ArrivalPlatformName);
    if (/unknown|^-?$/i.test(plat)) plat = '';
    out.push({
      id: v.ItemIdentifier || `${line}-${t}`, line, t,
      aimed: Date.parse(c.AimedDepartureTime || c.AimedArrivalTime || ''),
      dest: val(c.DestinationDisplay) || val(j.DestinationName) || '—',
      cancelled: st === 'cancelled', delayed: st === 'delayed', atStop: c.VehicleAtStop === true,
      plat, mission: val(j.JourneyNote), name: val(j.PublishedLineName),
    });
  }
  return out;
}

// ---- Info trafic (toutes les lignes ferrées : métro, RER, Transilien, tram) ---------------
const traffic = { items: [], status: {}, fetchedAt: 0, err: null, loading: false };

function htmlText(s) {
  if (!s) return '';
  const src = String(s).replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|li|div)>/gi, '\n');
  const doc = new DOMParser().parseFromString(src, 'text/html');   // jamais injecté : texte seulement
  return (doc.body.textContent || '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}
const cleanTitle = t => htmlText(t).replace(/^(Métro|RER|Tram(way)?|Train|Ligne|Transilien)?\s*[\w-]{0,4}\s*:\s*/i, '');

function parseTraffic(json) {
  const dis = new Map((json.disruptions || []).map(d => [d.id, d]));
  const t = now(), items = [], seen = new Set();
  for (const L of json.lines || []) {
    const id = lineIdOf(L.id);
    const li = LINES[id];
    if (!li || !['metro', 'rer', 'tram', 'train'].includes(li.m)) continue;
    const ids = new Set(), stops = new Map();   // perturbation -> stations touchées (vide : toute la ligne)
    for (const o of L.impactedObjects || []) for (const x of o.disruptionIds || []) {
      ids.add(x);
      if (!stops.has(x)) stops.set(x, new Set());
      if (o.type === 'stop_point' || o.type === 'stop_area') stops.get(x).add(norm(o.name));
      else stops.get(x).add('*');
    }
    for (const did of ids) {
      const d = dis.get(did);
      if (!d || seen.has(id + did)) continue;
      seen.add(id + did);
      let active = false, begin = NaN, end = NaN, next = Infinity;
      for (const p of d.applicationPeriods || []) {
        const b = parseCompact(p.begin), e = parseCompact(p.end);
        if (b <= t && t <= e) { active = true; begin = b; end = e; break; }
        if (b > t && b < next) { next = b; begin = b; end = e; }
      }
      if (!active && !(next - t < 24 * 3600e3)) continue;
      items.push({
        line: id, id: did, active, begin, end,
        level: d.severity === 'BLOQUANTE' ? 3 : d.severity === 'PERTURBEE' ? 2 : 1,
        works: d.cause === 'TRAVAUX', title: cleanTitle(d.title), short: htmlText(d.shortMessage), msg: htmlText(d.message),
        stops: stops.get(did).has('*') ? [] : [...stops.get(did)],
      });
    }
  }
  items.sort((a, b) => (b.active - a.active) || (b.level - a.level) || lineRank(a.line) - lineRank(b.line));
  const status = {};
  for (const it of items) if (it.active) {
    const s = status[it.line] || (status[it.line] = { level: 0, works: false });
    s.level = Math.max(s.level, it.level);
    if (it.works) s.works = true;
  }
  traffic.items = items;
  traffic.status = status;
  traffic.updated = Date.parse(json.lastUpdatedDate || '') || now();
}

// Info trafic relue toutes les 2 minutes quand les alertes sont actives (5 minutes sinon),
// y compris fenêtre réduite : c'est ce qui permet de prévenir dès qu'un incident survient.
const trafficEvery = () => settings.alerts === 'off' ? 300e3 : 120e3;
async function loadTraffic(force) {
  if (!settings.apiKey || traffic.loading) return;
  if (document.hidden && settings.alerts === 'off') return;
  if (!force && now() - traffic.fetchedAt < trafficEvery()) return;
  traffic.loading = true;
  try {
    parseTraffic(await primGet('/disruptions_bulk/disruptions/v2', 'trafic'));
    traffic.err = null;
    checkAlerts();
  } catch (e) {
    traffic.err = e.message;
  }
  traffic.fetchedAt = now();
  traffic.loading = false;
  renderTraffic();
  cards.forEach(c => c.render());
}
// Alerte sur une carte : perturbation de la ligne entière, ou de cette station
// Lignes du Grand Paris Express pas encore ouvertes : grisées dans la colonne Trafic, avec l'échéance
// prévue (novembre 2026 : 18 pas avant 2027, d'après l'exploitation de la ligne ; 16 et 17 repoussées à
// l'automne 2028 par la Société des grands projets). Une ligne reste dans cette liste tant qu'elle n'a
// pas ouvert, même si l'échéance est dépassée : à retirer à son ouverture.
const NOT_OPEN = {
  C02833: { when: 'en 2027', first: 'Massy-Palaiseau – Christ de Saclay' },                          // 18
  M16: { when: 'à l’automne 2028', first: 'Saint-Denis Pleyel – Parc du Blanc-Mesnil' },
  M17: { when: 'à l’automne 2028', first: 'Saint-Denis Pleyel – Le Bourget Aéroport – Parc des Expositions' },
};
const futureLine = id => NOT_OPEN[id] || null;
const lineAlert = (id, stopName) => traffic.items.find(it => it.active && it.line === id && it.level >= 2 &&
  (!it.stops.length || !stopName || it.stops.includes(norm(stopName))));

// =============================================================================
//  Trains SNCF : Train Nomade (sans clé, avec les voies)
// =============================================================================
const TN = 'https://api.trainnomade.fr/gare/';
const TRAIN_CAT = { highSpeedRail: 'TGV', interregionalRail: 'Intercités', regionalRail: 'TER', local: 'TER',
  suburbanRailway: 'Transilien', tramTrain: 'Tram-train', railShuttle: 'Navette', longDistance: 'Grande ligne' };
// Grandes gares de Paris : une carte, une gare par onglet
const PARIS_GARES = SNCF_STATIONS.slice(0, 7).map(([name, uics]) => ({ name, uics, short: name.replace(/^Gare (de l'|de |du )/, '') }));
const parisModel = () => ({ type: 'paris', key: 'paris', station: 0, arrivals: false });
const isTrainCard = m => m.type === 'gare' || m.type === 'paris';

const cleanStation = s => (s || '').replace(/\s+(RER|Transilien|Grandes Lignes|Surface|Souterrain)$/i, '').trim();

function parseTrainNomade(j, arrivals) {
  if (!j || !Array.isArray(j.passages)) throw new Error(j && j.erreur ? 'Gare inconnue' : 'Réponse inattendue');
  const [y, mo, d] = String(j.jour || '').split('-').map(Number);
  const noms = j.noms || {}, out = [], seen = new Set();
  for (const p of j.passages) {
    const tv = p[arrivals ? 'a' : 'd'];
    if (typeof tv !== 'number' || p.p) continue;
    if (settings.mainlineOnly && ['suburbanRailway', 'tramTrain', 'railShuttle'].includes(p.pr)) continue;
    const num = String(p.n || '').split(/[\/-]/)[0];
    if (num && seen.has(num)) continue;
    seen.add(num);
    const [jy, jm, jd] = p.j ? String(p.j).split('-').map(Number) : [y, mo, d];
    const base = parisToMs(jy, jm, jd, tv);
    const code = p[arrivals ? 'o' : 'de'];
    out.push({ base, real: base + (p[arrivals ? 'ra' : 'rd'] || 0) * 1000, num, cat: TRAIN_CAT[p.pr] || 'Train',
      place: cleanStation(noms[code] || code || ''), plat: p.v || '', realtime: !p.nm, cancelled: !!(p.an || p.x) });
  }
  return out.sort((a, b) => a.real - b.real);
}

// =============================================================================
//  Cartes : un arrêt (métro, RER, tram, bus) ou une gare SNCF
// =============================================================================
const cards = [];
let preview = null;

class Card {
  constructor(model, opts = {}) {
    this.m = model;
    this.preview = !!opts.preview;
    this.data = null;
    this.err = null;
    this.loading = false;
    this.fetchedAt = 0;
    this.cache = {};   // tableaux SNCF déjà reçus, par gare (changement d'onglet immédiat)
    this.el = el('article', { class: 'card' + (isTrainCard(model) ? ' wide' : ''), 'data-key': model.key });
    if (!this.preview) this.dragAndDrop();
    this.render();
  }

  get requests() { return this.m.type === 'stop' ? this.m.refs.length : 0; }

  interval() { return isTrainCard(this.m) ? 60 : stopInterval(); }

  // Gare affichée (carte d'une gare, ou onglet choisi des grandes gares de Paris)
  get gare() {
    if (this.m.type !== 'paris') return { name: this.m.name, uics: this.m.uics };
    return PARIS_GARES[Math.min(PARIS_GARES.length - 1, Math.max(0, this.m.station | 0))];
  }

  due() { return !this.loading && now() - this.fetchedAt >= this.interval() * 1000; }

  async refresh() {
    if (this.loading) return;
    this.loading = true;
    if (!this.data) this.render();
    const gare = this.m.type === 'paris' ? this.m.station : null;
    try {
      if (this.m.type === 'stop') {
        const all = [];
        for (const zda of this.m.refs) {
          const ref = `STIF:StopArea:SP:${zda}:`;
          all.push(...parseVisits(await primGet('/stop-monitoring?MonitoringRef=' + encodeURIComponent(ref))));
        }
        const uniq = new Map(all.map(v => [v.id, v]));
        this.data = [...uniq.values()].sort((a, b) => a.t - b.t);
      } else {
        const uics = this.gare.uics;
        let r;
        try { r = await fetch(TN + uics + '.json'); } catch { throw new ApiError('net', 'Train Nomade injoignable'); }
        if (!r.ok) throw new ApiError('http', `Train Nomade indisponible (${r.status})`);
        const raw = await r.json();
        this.cache[uics] = { raw, at: now() };
        if (uics === this.gare.uics) {   // sinon : un autre onglet a été choisi entre-temps
          this.raw = raw;
          this.data = parseTrainNomade(this.raw, this.m.arrivals);
        }
      }
      this.err = null;
    } catch (e) {
      this.err = e;
    }
    this.loading = false;
    if (gare !== null && gare !== this.m.station) return this.refresh();   // autre onglet entre-temps
    this.fetchedAt = now();
    this.render();
  }

  render() {
    const m = this.m;
    const lines = this.lineIds();
    const train = isTrainCard(m), name = train ? this.gare.name : m.name;
    const head = el('header', { class: 'card-head', draggable: this.preview ? null : 'true' },
      el('div', { class: 'card-title' },
        el('div', { class: 'mode' }, icon(train ? 'm-train' : MODE_ICON[this.mainMode()] || 'm-bus'),
          m.type === 'paris' ? 'Train · Grandes gares de Paris' : train ? 'Train · ' + (m.arrivals ? 'Arrivées' : 'Départs')
            : m.sub || MODE_LABEL[this.mainMode()] || 'Arrêt'),
        el('div', { class: 'card-name', title: name }, name)),
      m.type === 'stop' ? el('div', { class: 'lbs' }, lines.slice(0, 6).map(id => badge(id, 'lg'))) : null,
      train ? el('div', { class: 'seg', role: 'group' },
        el('button', { 'aria-pressed': String(!m.arrivals), onclick: () => this.setArrivals(false) }, 'Départs'),
        el('button', { 'aria-pressed': String(!!m.arrivals), onclick: () => this.setArrivals(true) }, 'Arrivées')) : null,
      el('div', { class: 'card-acts' },
        el('button', { class: 'ibtn', title: 'Actualiser', onclick: () => this.refresh() }, icon('i-swap')),
        el('button', { class: 'ibtn', title: 'Retirer du tableau', onclick: () => unpin(m.key) }, icon('i-close'))));

    const bar = el('div', { class: 'card-bar' },
      (lines.length ? lines : ['']).slice(0, 8).map(id => el('i', { style: `background:${(lineInfo(id) || {}).c || '#ffb400'}` })));
    if (train) bar.replaceChildren(el('i', { style: 'background:var(--amber)' }));
    const tabs = m.type === 'paris' ? el('nav', { class: 'gtabs', role: 'tablist' }, PARIS_GARES.map((g, i) =>
      el('button', { class: 'gtab', role: 'tab', 'aria-pressed': String(i === (m.station | 0)), title: g.name,
        onclick: () => this.setStation(i) }, g.short))) : null;

    const alerts = lines.map(id => lineAlert(id, m.name)).filter(Boolean);
    const alert = alerts.length ? el('div', { class: 'card-alert l' + Math.max(...alerts.map(a => a.level)),
      onclick: () => openLine(alerts[0].line) }, icon('i-warn'), badge(alerts[0].line, 'sm'),
    el('span', {}, alerts[0].short || alerts[0].title)) : null;

    const foot = el('footer', { class: 'card-foot' },
      el('span', { class: 'grow' + (this.err && this.data ? ' err' : '') },
        this.err && this.data ? '⚠ ' + this.err.message
          : this.fetchedAt ? 'Mis à jour à ' + hm(this.fetchedAt) : ''),
      train ? el('span', {}, 'Train Nomade · SNCF') : el('span', {}, 'PRIM · IDFM'));

    this.el.replaceChildren(...[bar, head, tabs, alert, el('div', { class: 'card-body' }, this.body()), foot].filter(Boolean));
  }

  mainMode() {
    const ids = this.lineIds();
    for (const mode of ['metro', 'rer', 'train', 'tram', 'bus']) if (ids.some(id => (lineInfo(id) || {}).m === mode)) return mode;
    return this.m.mode || 'bus';
  }

  lineIds() {
    if (this.m.type !== 'stop') return [];
    const ids = new Set(this.m.lines || []);
    if (this.data) for (const v of this.data) ids.add(v.line);
    return [...ids].sort((a, b) => lineRank(a) - lineRank(b));
  }

  setArrivals(arr) {   // départs et arrivées sont dans la même réponse
    if (!!this.m.arrivals === arr) return;
    this.m.arrivals = arr;
    if (!this.preview) savePins();
    this.data = this.raw ? parseTrainNomade(this.raw, arr) : null;
    if (!this.data) this.fetchedAt = 0;
    this.render();
  }

  setStation(i) {
    if ((this.m.station | 0) === i) return;
    this.m.station = i;
    if (!this.preview) savePins();
    const c = this.cache[this.gare.uics];
    if (c && now() - c.at < 60e3) {
      this.raw = c.raw;
      this.data = parseTrainNomade(c.raw, this.m.arrivals);
      this.fetchedAt = c.at;
      this.err = null;
    } else {
      this.raw = null;
      this.data = null;
      this.err = null;
      this.fetchedAt = 0;
      this.refresh();
    }
    this.render();
  }

  body() {
    if (this.m.type === 'stop' && !settings.apiKey)
      return el('div', { class: 'state' }, icon('i-key'), el('b', {}, 'Clé PRIM nécessaire'),
        el('span', {}, 'Ajoutez votre clé gratuite dans les réglages.'));
    if (!this.data) {
      if (this.err) return el('div', { class: 'state err' }, icon('i-warn'), el('b', {}, this.err.message),
        el('span', {}, this.err.kind === 'key' ? 'Vérifiez la clé dans les réglages.' : 'Nouvel essai bientôt.'));
      return el('div', { class: 'state' }, el('div', { class: 'loader' }), 'Chargement…');
    }
    return this.m.type === 'stop' ? this.stopRows() : this.trainRows();
  }

  stopRows() {
    const t0 = now() - 30e3;
    const visits = this.data.filter(v => v.t >= t0 || v.atStop);
    if (!visits.length) return el('div', { class: 'state' }, el('b', {}, 'Aucun passage annoncé'),
      el('span', {}, 'Service terminé ou pas encore commencé.'));
    const max = this.preview ? 14 : (document.body.classList.contains('compact') ? 6 : 8);
    const rows = [];
    const byLine = new Map();
    for (const v of visits) (byLine.get(v.line) || byLine.set(v.line, []).get(v.line)).push(v);
    const lines = [...byLine.keys()].sort((a, b) => lineRank(a) - lineRank(b) || byLine.get(a)[0].t - byLine.get(b)[0].t);
    const perLine = Math.max(3, Math.floor(max / lines.length));   // trains par ligne de RER ou Transilien
    for (const line of lines) {
      const list = byLine.get(line);
      const mode = (lineInfo(line) || {}).m || 'bus';
      if (mode === 'rer' || mode === 'train') {     // RER, Transilien : trains dans l'ordre, avec la mission
        for (const v of list.slice(0, perLine)) rows.push({ line, dest: v.dest, times: [v], v });
      } else {                                      // métro, tram, bus : par destination, deux passages
        const byDest = new Map();
        for (const v of list) (byDest.get(v.dest) || byDest.set(v.dest, []).get(v.dest)).push(v);
        for (const [dest, vs] of [...byDest].sort((a, b) => a[1][0].t - b[1][0].t)) rows.push({ line, dest, times: vs.slice(0, 2), v: vs[0] });
      }
    }
    const shown = rows.slice(0, max);
    return [
      shown.map(r => el('div', { class: 'row' }, badge(r.line, 'lg', r.v.name),
        el('div', { class: 'dest' },
          el('div', { class: 'dest-name', title: r.dest }, icon('i-arrow'), r.dest),
          (r.v.mission || r.v.plat) ? el('div', { class: 'dest-info' },
            r.v.mission ? el('span', { class: 'chip' }, r.v.mission) : null,
            r.v.plat ? el('span', { class: 'chip voie' }, 'Voie ' + r.v.plat) : null) : null),
        el('div', { class: 'times' }, r.times.map((v, i) => timeCell(v, i > 0))))),
      rows.length > max ? el('div', { class: 'more' }, `+ ${rows.length - max} autre${rows.length - max > 1 ? 's' : ''} départ${rows.length - max > 1 ? 's' : ''}`) : null,
    ];
  }

  trainRows() {
    const list = this.data.filter(t => t.real >= now() - 60e3);
    if (!list.length) return el('div', { class: 'state' }, el('b', {}, this.m.arrivals ? 'Aucune arrivée prévue' : 'Aucun départ prévu'),
      el('span', {}, settings.mainlineOnly ? 'Grandes lignes seulement (réglages).' : 'Dans les prochaines heures.'));
    const max = this.preview ? 14 : 8;
    return [
      el('div', { class: 'trow head' }, el('span', {}, 'Heure'), el('span', {}, this.m.arrivals ? 'Provenance' : 'Destination'),
        el('span', {}, 'Train'), el('span', {}, 'Voie'), el('span', { style: 'text-align:right' }, 'État')),
      list.slice(0, max).map(t => {
        const late = Math.round((t.real - t.base) / 60000);
        const st = t.cancelled ? ['cancel', 'Supprimé'] : !t.realtime ? ['plan', 'Prévu'] : late > 0 ? ['late', `+${late} min`] : ['ok', 'À l’heure'];
        return el('div', { class: 'trow' },
          el('div', { class: 'th' }, late > 0 && !t.cancelled ? [el('s', {}, hm(t.base)), hm(t.real)] : hm(t.base)),
          el('div', { class: 'tdest', title: t.place }, t.place),
          el('div', { class: 'ttrain' }, el('span', { class: 'chip' }, t.cat), t.num),
          el('div', { class: 'tvoie' + (t.plat ? '' : ' none') }, t.plat || '—'),
          el('div', { class: 'tstate ' + st[0] }, st[1]));
      }),
    ];
  }

  dragAndDrop() {
    this.el.addEventListener('dragstart', e => { dragKey = this.m.key; this.el.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; });
    this.el.addEventListener('dragend', () => { this.el.classList.remove('drag'); document.querySelectorAll('.card.over').forEach(c => c.classList.remove('over')); });
    this.el.addEventListener('dragover', e => { if (dragKey && dragKey !== this.m.key) { e.preventDefault(); this.el.classList.add('over'); } });
    this.el.addEventListener('dragleave', () => this.el.classList.remove('over'));
    this.el.addEventListener('drop', e => { e.preventDefault(); this.el.classList.remove('over'); movePin(dragKey, this.m.key); });
  }
}
let dragKey = null;

function timeCell(v, next) {
  const min = Math.floor((v.t - now()) / 60000);
  if (v.cancelled) return el('div', { class: 't cancel' }, 'SUPPRIMÉ');
  if (v.atStop && min <= 0) return el('div', { class: 't now' + (next ? ' next' : '') }, 'À QUAI');
  if (min <= 0) return el('div', { class: 't now' + (next ? ' next' : '') }, 'APPROCHE');
  if (min >= 60) return el('div', { class: 't clock' + (next ? ' next' : '') }, hm(v.t));
  return el('div', { class: 't' + (next ? ' next' : '') + (v.delayed ? ' late' : ''), title: 'Passage à ' + hm(v.t) },
    String(min), el('small', {}, 'min'));
}

// Rythme des appels PRIM : réglage, ralenti pour tenir le quota de la journée (jusqu'à 20 h)
function stopInterval() {
  const perCycle = cards.reduce((n, c) => n + c.requests, 0) + (preview ? preview.requests : 0) || 1;
  const left = settings.budget - quota.used('prim');
  if (left <= 0) return 3600;
  const p = parisParts(now());
  const sec = p.h * 3600 + p.m * 60 + p.s;
  const end = sec < 20 * 3600 ? 20 * 3600 : 24 * 3600;
  return Math.max(settings.refresh, Math.ceil((end - sec) * perCycle / left));
}

  if (isPinned(model.key)) return;

function unpin(key) {

function movePin(from, to) {
  const a = pins.findIndex(p => p.key === from), b = pins.findIndex(p => p.key === to);
  if (a < 0 || b < 0) return;
  const [m] = pins.splice(a, 1);

const STATIONS = (() => {
  const map = new Map();
  for (const l of NETWORK) {
    if (!LINES[l.id]) continue;   // les stations sans zone d'arrêt (pas encore ouvertes) sont écartées ci-dessous
    for (const [zda, name, , year] of l.stops) {
      if (!zda || year) continue;
      const k = norm(name);
      const s = map.get(k) || map.set(k, { name, key: k, lines: [], refs: [] }).get(k);
      if (!s.lines.includes(l.id)) s.lines.push(l.id);
      if (!s.refs.includes(zda)) s.refs.push(zda);
    }
  }
  for (const s of map.values()) s.lines.sort((a, b) => lineRank(a) - lineRank(b));
  return [...map.values()];
})();
const GARES = SNCF_STATIONS.map(([name, uics]) => ({ name, uics, key: norm(name) }));
const findStation = name => STATIONS.find(s => s.key === norm(name));

function stationModel(s) {
  if (!s) return null;
  const modes = [...new Set(s.lines.map(id => MODE_LABEL[LINES[id].m]))].join(' · ');
  return { type: 'stop', key: 'stop:' + [...s.refs].sort().join(','), name: s.name, sub: modes, refs: s.refs.slice(0, 4), lines: s.lines };
}
function gareModel(g) {
  if (!g) return null;
  const [name, uics] = Array.isArray(g) ? g : [g.name, g.uics];
  return { type: 'gare', key: 'gare:' + uics, name, uics, arrivals: false };
}

function score(key, q) {
  if (key === q) return 0;
  if (key.startsWith(q)) return 1;
  if ((' ' + key).includes(' ' + q)) return 2;
  if (q.split(' ').every(w => (' ' + key).includes(' ' + w))) return 3;
  return 9;
}
function localSearch(list, q, n) {
  return list.map(s => [score(s.key, q), s]).filter(x => x[0] < 9)
    .sort((a, b) => a[0] - b[0] || a[1].name.length - b[1].name.length).slice(0, n).map(x => x[1]);
}

const ZDA_TYPES = { metroStation: ['metro', 'Station de métro'], railStation: ['rer', 'Gare'], onstreetTram: ['tram', 'Arrêt de tram'],
  onstreetBus: ['bus', 'Arrêt de bus'] };
const onlineSearch = debounce(async (q, seq) => {
  const enc = encodeURIComponent(`"${q.replace(/"/g, ' ')}"`);
  const stops = fetch(ODS_IDFM + 'zones-d-arrets/records?limit=30&where=' + enc).then(r => r.json()).then(j =>
    (j.results || []).map(r => {
      const t = ZDA_TYPES[r.zdatype] || ['bus', 'Arrêt'];
      return { zda: String(r.zdaid), name: r.zdaname, town: r.zdatown || '', type: t[0], label: t[1] };
    }).filter(o => o.zda && o.zda !== '0')).catch(() => []);
  const gares = fetch('https://ressources.data.sncf.com/api/explore/v2.1/catalog/datasets/gares-de-voyageurs/records?limit=8&select=nom,codes_uic&where=' + enc)
    .then(r => r.json()).then(j => (j.results || []).map(r => ({ name: r.nom, uics: String(r.codes_uic || '').replace(/[^\d,;]/g, '').replace(/;/g, ',') }))
      .filter(g => g.uics)).catch(() => []);
  const [s, g] = await Promise.all([stops, gares]);
  if (seq !== searchUi.seq) return;
  const rank = { metro: 0, rer: 1, tram: 2, bus: 3 };
  searchUi.online = s.sort((a, b) => rank[a.type] - rank[b.type]);

const alertsUi = { known: null, cards: new Map(), clickLine: null };
const lineLabel = id => { const li = lineInfo(id); return li ? `${MODE_LABEL[li.m] || 'Ligne'} ${li.n}` : 'Ligne'; };
const incidentTag = g => (g.works ? 'Travaux · ' : 'Incident · ') + (g.level === 3 ? 'trafic interrompu' : 'trafic perturbé');

// Incidents en cours (trafic perturbé ou interrompu) sur les lignes surveillées, par perturbation
function incidents() {
  const map = new Map();
  if (settings.alerts === 'off') return map;
  let mine = null;
  if (settings.alerts === 'mine') {
    mine = new Set(settings.followed || []);
    for (const c of cards) for (const id of c.lineIds()) mine.add(id);
  }
  for (const it of traffic.items) {
    if (!it.active || it.level < 2 || (mine && !mine.has(it.line))) continue;
    const g = map.get(it.id) || map.set(it.id, { id: it.id, lines: [], level: it.level, works: it.works, title: it.title,
      short: it.short, msg: it.msg, begin: it.begin, end: it.end }).get(it.id);
    if (!g.lines.includes(it.line)) g.lines.push(it.line);
    g.level = Math.max(g.level, it.level);
  }
  return map;
}

function resetAlerts() { alertsUi.known = traffic.updated ? incidents() : null; }   // réglage changé : pas de rappel

function checkAlerts() {   // après chaque lecture de l'info trafic
  const cur = incidents();
  if (alertsUi.known === null) {   // au lancement : rien (les incidents déjà en cours sont dans la colonne Trafic)
    alertsUi.known = cur;
    return;
  }
  for (const [id, g] of cur) {
    const old = alertsUi.known.get(id);
    if (!old || g.level > old.level) {
      showIncident(g, old ? 'worse' : 'new');
      notifyOutside(g, old ? 'Aggravation' : '');
    } else if (alertsUi.cards.has(id)) showIncident(g, alertsUi.cards.get(id).kind, true);   // détails mis à jour
  }
  for (const [id, g] of alertsUi.known) if (!cur.has(id)) { showIncident(g, 'end'); notifyOutside(g, 'Trafic rétabli'); }
  alertsUi.known = cur;
}

function popup(key, cls, ttl, build, keep) {
  const old = alertsUi.cards.get(key);
  const box = $('#alerts');
  const node = el('article', { class: 'alert ' + cls, role: 'alert' });
  const card = { el: node, timer: 0, kind: cls.split(' ')[0] };
  const close = () => {
    clearTimeout(card.timer);
    node.classList.add('out');
    setTimeout(() => { node.remove(); if (alertsUi.cards.get(key) === card) alertsUi.cards.delete(key); }, 240);
  };
  node.append(...build(close).filter(Boolean), el('i', { class: 'alert-life', style: `animation-duration:${ttl}ms` }));
  const arm = () => { clearTimeout(card.timer); card.timer = setTimeout(close, ttl); };
  node.addEventListener('mouseenter', () => clearTimeout(card.timer));
  node.addEventListener('mouseleave', arm);
  arm();
  if (old) { clearTimeout(old.timer); if (keep) { node.style.animation = 'none'; old.el.replaceWith(node); } else old.el.remove(); }
  if (!node.isConnected) box.prepend(node);
  alertsUi.cards.set(key, card);
  [...alertsUi.cards].slice(0, -3).forEach(([k, c]) => { clearTimeout(c.timer); c.el.remove(); alertsUi.cards.delete(k); });   // 3 au plus
}

// ---- Son des alertes : court carillon synthétisé (aucun fichier audio) ----------------------
let audioCtx = null;
const audio = () => (audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)());
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { try { audio().resume(); } catch { /* pas de son */ } }, { once: true }));
function chime(kind, force) {
  if (!settings.sound && !force) return;
  try {
    const ctx = audio();
    if (ctx.state === 'suspended') ctx.resume();
    // incident : trois notes descendantes ; aggravation : deux fois deux notes ; rétabli : deux notes montantes, plus douces
    const notes = kind === 'end' ? [[659.3, 0, .16], [880, .17, .16]]
      : kind === 'worse' ? [[880, 0, .26], [659.3, .15, .26], [880, .34, .26], [659.3, .49, .26]]
        : [[987.8, 0, .26], [784, .19, .26], [587.3, .38, .26]];
    const t0 = ctx.currentTime + .03;
    for (const [f, dt, vol] of notes) {
      for (const [mult, v] of [[1, 1], [2.01, .18], [3, .06]]) {   // fondamentale + harmoniques : timbre de cloche
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = f * mult;
        g.gain.setValueAtTime(.0001, t0 + dt);
        g.gain.exponentialRampToValueAtTime(vol * v, t0 + dt + .012);
        g.gain.exponentialRampToValueAtTime(.0001, t0 + dt + (kind === 'end' ? .7 : 1.1));
        o.connect(g).connect(ctx.destination);
        o.start(t0 + dt);
        o.stop(t0 + dt + 1.2);
      }
    }
  } catch { /* son indisponible */ }
}

function showIncident(g, kind, keep) {
  const end = kind === 'end';
  if (!keep) chime(kind);
  popup(g.id, `${kind} l${end ? 0 : g.level}`, end ? 20e3 : 75e3, close => [
    el('header', { class: 'alert-head' }, el('div', { class: 'lbs' }, g.lines.slice(0, 6).map(id => badge(id, 'lg'))),
      el('div', { class: 'alert-tag' }, end ? 'Trafic rétabli' : (kind === 'worse' ? 'Aggravation · ' : '') + incidentTag(g)),
      el('button', { class: 'ibtn', title: 'Fermer', onclick: close }, icon('i-close'))),
    el('h4', {}, g.title || g.short || 'Perturbation'),
    el('div', { class: 'when' }, end ? 'Fin de la perturbation · ' + hm(now()) : whenText(g.begin, g.end)),
    end ? null : el('p', { class: 'alert-msg' }, g.msg || g.short),
    end ? null : el('div', { class: 'alert-foot' }, el('button', { class: 'btn', onclick: () => { close(); openLine(g.lines[0]); } }, 'Voir la ligne')),
  ], keep);
}

// KeoLive n'est pas au premier plan : notification de Windows (ou du navigateur)
function notifyOutside(g, prefix) {
  if (!document.hidden && document.hasFocus()) return;
  const title = g.lines.slice(0, 3).map(lineLabel).join(', ') + ' : ' + (prefix || (g.level === 3 ? 'trafic interrompu' : 'trafic perturbé'));
  const text = [g.title, g.short !== g.title ? g.short : ''].filter(Boolean).join(' · ').slice(0, 230);
  alertsUi.clickLine = g.lines[0];
  if (NATIVE) native('notify', title + '\n' + text);
  else if (window.Notification && Notification.permission === 'granted') {
    const n = new Notification(title, { body: text, icon: $('link[rel=icon]').href });
    n.onclick = () => { window.focus(); openLine(g.lines[0]); };
  }
}
window.keoNotifyClick = () => { if (alertsUi.clickLine) openLine(alertsUi.clickLine); };
